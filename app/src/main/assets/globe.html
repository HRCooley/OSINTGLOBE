<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlobeNews</title>
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
            background: #0d1117;
        }
        #statusMsg {
            position: absolute; top: 30%; left: 0; right: 0;
            text-align: center; color: #aaa; font-family: sans-serif; font-size: 14px;
            padding: 20px; z-index: 9999; pointer-events: none;
        }
        #statusMsg.error { color: #ff4444; }
        #debugInfo {
            position: absolute; bottom: 60px; left: 10px; right: 10px;
            color: #0f0; font-family: monospace; font-size: 11px;
            z-index: 99999; pointer-events: none; background: rgba(0,0,0,0.7);
            padding: 8px; border-radius: 4px; max-height: 120px; overflow: auto;
        }
        .cesium-viewer-bottom, .cesium-viewer-toolbar,
        .cesium-viewer-animationContainer, .cesium-viewer-timelineContainer,
        .cesium-viewer-fullscreenContainer, .cesium-viewer-infoBoxContainer,
        .cesium-viewer-selectionIndicatorContainer, .cesium-viewer-geocoderContainer,
        .cesium-viewer-navigationHelpButtonContainer {
            display: none !important;
        }
        .cesium-credit-logoContainer, .cesium-credit-expand-link,
        .cesium-credit-textContainer { display: none !important; }
    </style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="statusMsg">Loading globe engine...</div>
<div id="debugInfo">Debug: starting...</div>

<script>
    // ---- Debug logging (visible on screen) ----
    var debugLines = [];
    function dbg(msg) {
        debugLines.push(msg);
        if (debugLines.length > 8) debugLines.shift();
        var el = document.getElementById('debugInfo');
        if (el) el.textContent = debugLines.join('\n');
        console.log('GlobeDBG: ' + msg);
    }

    // ---- Error handling ----
    window.onerror = function(msg, src, line) {
        showError('JS Error: ' + msg + ' (line ' + line + ')');
        dbg('ERROR: ' + msg);
        return false;
    };

    function showError(msg) {
        var el = document.getElementById('statusMsg');
        if (el) { el.className = 'error'; el.textContent = msg; el.style.display = 'block'; }
        console.error('GlobeNews: ' + msg);
    }

    function showStatus(msg) {
        var el = document.getElementById('statusMsg');
        if (el) { el.textContent = msg; el.style.display = 'block'; }
        console.log('GlobeNews: ' + msg);
    }

    // ---- Check WebGL support ----
    function checkWebGL() {
        var canvas = document.createElement('canvas');
        var gl = null;
        try {
            gl = canvas.getContext('webgl2') || canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        } catch(e) {}
        if (gl) {
            var renderer = gl.getParameter(gl.RENDERER);
            dbg('WebGL OK: ' + renderer);
            return true;
        } else {
            dbg('WebGL NOT available!');
            return false;
        }
    }

    // ---- Globe state ----
    var SCOPE_COLORS = {};
    var viewer = null;
    var markers = {};
    var cameraMoveTimeout = null;
    var isReady = false;

    // ---- Load Cesium.js dynamically ----
    function loadCesium() {
        dbg('Checking WebGL...');
        if (!checkWebGL()) {
            showError('WebGL not supported on this device.');
            return;
        }

        showStatus('Downloading Cesium.js...');
        dbg('Loading Cesium CSS + JS from CDN...');

        // Load CSS
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css';
        document.head.appendChild(link);

        // Load JS with timeout detection
        var loaded = false;
        var script = document.createElement('script');
        script.src = 'https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js';
        script.onload = function() {
            loaded = true;
            dbg('Cesium.js loaded (' + (typeof Cesium) + ')');
            showStatus('Initializing globe...');
            var token = '';
            try {
                if (typeof AndroidBridge !== 'undefined' && AndroidBridge.getCesiumToken) {
                    token = AndroidBridge.getCesiumToken();
                }
            } catch(e) { dbg('Token error: ' + e); }
            initViewer(token);
        };
        script.onerror = function(e) {
            dbg('Script onerror fired');
            showError('Failed to load Cesium.js. Check internet connection.');
        };
        document.body.appendChild(script);

        // Timeout check after 30 seconds
        setTimeout(function() {
            if (!loaded) {
                dbg('Cesium load TIMEOUT (30s)');
                showError('Cesium.js load timed out. Check your connection.');
            }
        }, 30000);
    }

    // ---- Globe initialization ----
    function initViewer(ionToken) {
        if (typeof Cesium === 'undefined') {
            showError('Cesium library not available.');
            dbg('Cesium is undefined!');
            return;
        }

        try {
            dbg('Cesium version: ' + Cesium.VERSION);

            // Init scope colors now that Cesium is loaded
            SCOPE_COLORS = {
                'INTERNATIONAL': Cesium.Color.fromCssColorString('#ff4444').withAlpha(0.9),
                'NATIONAL': Cesium.Color.fromCssColorString('#ff9944').withAlpha(0.9),
                'REGIONAL': Cesium.Color.fromCssColorString('#4488ff').withAlpha(0.9),
                'LOCAL': Cesium.Color.fromCssColorString('#4488ff').withAlpha(0.9)
            };

            if (ionToken && ionToken.length > 0) {
                Cesium.Ion.defaultAccessToken = ionToken;
            }

            dbg('Creating Viewer...');

            // Simple viewer creation - no base layer initially
            viewer = new Cesium.Viewer('cesiumContainer', {
                baseLayer: false,
                baseLayerPicker: false,
                geocoder: false,
                homeButton: false,
                infoBox: false,
                sceneModePicker: false,
                selectionIndicator: false,
                timeline: false,
                animation: false,
                navigationHelpButton: false,
                fullscreenButton: false,
                vrButton: false,
                scene3DOnly: true,
                skyBox: false,
                skyAtmosphere: false
            });

            dbg('Viewer created OK');

            // Add OpenStreetMap tiles
            try {
                viewer.imageryLayers.addImageryProvider(
                    new Cesium.UrlTemplateImageryProvider({
                        url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                        credit: 'OpenStreetMap',
                        maximumLevel: 19
                    })
                );
                dbg('OSM imagery added');
            } catch(e) {
                dbg('Imagery error: ' + e.message);
            }

            // Flat terrain
            viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider();

            // Globe appearance - bright base color to confirm rendering
            viewer.scene.globe.enableLighting = false;
            viewer.scene.globe.showGroundAtmosphere = false;
            viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#0d1117');
            viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#2d4a6f');

            // Check canvas
            var canvas = viewer.scene.canvas;
            dbg('Canvas: ' + canvas.width + 'x' + canvas.height);

            // Check if globe is rendering
            dbg('Globe show: ' + viewer.scene.globe.show);
            dbg('Scene mode: ' + viewer.scene.mode);

            // Entity clustering
            viewer.dataSourceDisplay.defaultDataSource.clustering.enabled = true;
            viewer.dataSourceDisplay.defaultDataSource.clustering.pixelRange = 40;
            viewer.dataSourceDisplay.defaultDataSource.clustering.minimumClusterSize = 3;

            // Camera move listener
            viewer.camera.moveEnd.addEventListener(function() {
                if (cameraMoveTimeout) clearTimeout(cameraMoveTimeout);
                cameraMoveTimeout = setTimeout(function() {
                    if (typeof AndroidBridge !== 'undefined') {
                        AndroidBridge.onCameraMove(getCurrentView());
                    }
                }, 400);
            });

            // Marker click handler
            var handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
            handler.setInputAction(function(click) {
                var picked = viewer.scene.pick(click.position);
                if (Cesium.defined(picked) && picked.id && picked.id.storyId) {
                    if (typeof AndroidBridge !== 'undefined') {
                        AndroidBridge.onMarkerTap(picked.id.storyId);
                    }
                }
            }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

            // Report render after a short delay
            setTimeout(function() {
                if (viewer && viewer.scene) {
                    var c = viewer.scene.canvas;
                    var gl = c.getContext('webgl2') || c.getContext('webgl');
                    if (gl) {
                        dbg('GL context on Cesium canvas: YES');
                        dbg('Drawing buffer: ' + gl.drawingBufferWidth + 'x' + gl.drawingBufferHeight);
                    } else {
                        dbg('GL context on Cesium canvas: FAILED');
                    }
                }
            }, 2000);

            // Success - hide status (keep debug visible)
            var el = document.getElementById('statusMsg');
            if (el) el.style.display = 'none';

            isReady = true;
            dbg('Globe ready!');
            if (typeof AndroidBridge !== 'undefined') {
                AndroidBridge.onReady();
            }
        } catch (e) {
            showError('Globe init failed: ' + e.message);
            dbg('INIT ERROR: ' + e.message);
            dbg('Stack: ' + (e.stack || 'none').substring(0, 200));
        }
    }

    // ---- Marker management (called from Android) ----
    function addMarkers(jsonArrayString) {
        if (!viewer) return;
        try {
            var items = JSON.parse(jsonArrayString);
            var altitude = viewer.camera.positionCartographic.height / 1000;

            items.forEach(function(item) {
                if (markers[item.id]) {
                    viewer.entities.remove(markers[item.id]);
                }

                var color = SCOPE_COLORS[item.scope] || SCOPE_COLORS['NATIONAL'];
                var hoursAgo = (Date.now() - (item.publishedAt || Date.now())) / 3600000;
                var size = hoursAgo < 6 ? 12 : (hoursAgo < 24 ? 9 : 7);
                if (altitude > 15000) size = 6;
                else if (altitude < 500) size = 14;

                var entity = viewer.entities.add({
                    position: Cesium.Cartesian3.fromDegrees(item.lon, item.lat),
                    point: {
                        pixelSize: size,
                        color: color,
                        outlineColor: Cesium.Color.WHITE.withAlpha(0.5),
                        outlineWidth: 1,
                        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                        disableDepthTestDistance: Number.POSITIVE_INFINITY
                    },
                    label: altitude < 500 ? {
                        text: item.title ? item.title.substring(0, 40) : '',
                        font: '11px sans-serif',
                        fillColor: Cesium.Color.WHITE,
                        outlineColor: Cesium.Color.BLACK,
                        outlineWidth: 2,
                        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                        pixelOffset: new Cesium.Cartesian2(0, -16),
                        disableDepthTestDistance: Number.POSITIVE_INFINITY,
                        showBackground: true,
                        backgroundColor: Cesium.Color.fromCssColorString('rgba(0,0,0,0.7)')
                    } : undefined
                });

                entity.storyId = item.id;
                markers[item.id] = entity;
            });
        } catch (e) {
            console.error('addMarkers error:', e);
        }
    }

    function clearMarkers() {
        if (!viewer) return;
        Object.keys(markers).forEach(function(id) {
            viewer.entities.remove(markers[id]);
        });
        markers = {};
    }

    function flyTo(lat, lon, altitudeKm) {
        if (!viewer) return;
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(lon, lat, altitudeKm * 1000),
            duration: 2.0
        });
    }

    function getCurrentView() {
        if (!viewer) return '{}';
        var c = viewer.camera.positionCartographic;
        var lat = Cesium.Math.toDegrees(c.latitude);
        var lon = Cesium.Math.toDegrees(c.longitude);
        var altitude = c.height / 1000;

        var rect = viewer.camera.computeViewRectangle();
        var bounds;
        if (rect) {
            bounds = {
                north: Cesium.Math.toDegrees(rect.north),
                south: Cesium.Math.toDegrees(rect.south),
                east: Cesium.Math.toDegrees(rect.east),
                west: Cesium.Math.toDegrees(rect.west)
            };
        } else {
            bounds = {
                north: Math.min(lat + 30, 90), south: Math.max(lat - 30, -90),
                east: Math.min(lon + 60, 180), west: Math.max(lon - 60, -180)
            };
        }
        return JSON.stringify({ lat: lat, lon: lon, altitude: altitude, bounds: bounds });
    }

    function setBaseLayer(providerName) {
        if (!viewer) return;
        viewer.imageryLayers.removeAll();

        var provider;
        switch (providerName) {
            case 'satellite':
                if (Cesium.Ion.defaultAccessToken) {
                    try {
                        Cesium.IonImageryProvider.fromAssetId(2).then(function(p) {
                            viewer.imageryLayers.addImageryProvider(p);
                        }).catch(function() {
                            viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
                                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                                maximumLevel: 18
                            }));
                        });
                        return;
                    } catch(e) {}
                }
                provider = new Cesium.UrlTemplateImageryProvider({
                    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                    maximumLevel: 18
                });
                break;
            case 'streets':
                provider = new Cesium.UrlTemplateImageryProvider({
                    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                    credit: 'OpenStreetMap', maximumLevel: 18
                });
                break;
            case 'dark':
                provider = new Cesium.UrlTemplateImageryProvider({
                    url: 'https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                    credit: 'CartoDB', maximumLevel: 18
                });
                break;
            default:
                provider = new Cesium.UrlTemplateImageryProvider({
                    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                    credit: 'OpenStreetMap', maximumLevel: 19
                });
                break;
        }
        viewer.imageryLayers.addImageryProvider(provider);
    }

    function highlightMarker(id) {
        if (!viewer || !markers[id]) return;
        var entity = markers[id];
        if (entity.point) {
            var orig = entity.point.pixelSize.getValue();
            var n = 0;
            var iv = setInterval(function() {
                entity.point.pixelSize = (n % 2 === 0) ? orig * 1.8 : orig;
                entity.point.outlineWidth = (n % 2 === 0) ? 3 : 1;
                if (++n >= 6) { clearInterval(iv); entity.point.pixelSize = orig; entity.point.outlineWidth = 1; }
            }, 300);
        }
    }

    // ---- Start loading when page is ready ----
    dbg('Page loaded, starting Cesium load...');
    loadCesium();
</script>
</body>
</html>

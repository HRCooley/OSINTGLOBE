<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlobeNews</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #map {
            width: 100%; height: 100%; overflow: hidden;
            background: #0d1117;
        }
        /* Dark theme for cluster markers */
        .marker-cluster-small {
            background-color: rgba(255, 68, 68, 0.6);
        }
        .marker-cluster-small div {
            background-color: rgba(255, 68, 68, 0.8);
        }
        .marker-cluster-medium {
            background-color: rgba(255, 153, 68, 0.6);
        }
        .marker-cluster-medium div {
            background-color: rgba(255, 153, 68, 0.8);
        }
        .marker-cluster-large {
            background-color: rgba(68, 136, 255, 0.6);
        }
        .marker-cluster-large div {
            background-color: rgba(68, 136, 255, 0.8);
        }
        .marker-cluster div {
            width: 30px; height: 30px; margin-left: 5px; margin-top: 5px;
            text-align: center; border-radius: 15px;
            font: bold 12px sans-serif; color: #fff;
            line-height: 30px;
        }
        .marker-cluster {
            background-clip: padding-box; border-radius: 20px;
        }
        /* Hide Leaflet attribution for cleaner UI (credit in code) */
        .leaflet-control-attribution {
            display: none !important;
        }
        /* Custom dot markers */
        .news-dot {
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .news-dot-international { background: rgba(255, 68, 68, 0.9); }
        .news-dot-national { background: rgba(255, 153, 68, 0.9); }
        .news-dot-regional { background: rgba(68, 136, 255, 0.9); }
        .news-dot-local { background: rgba(68, 136, 255, 0.9); }
        /* Zoom controls dark theme */
        .leaflet-control-zoom a {
            background: rgba(0,0,0,0.7) !important;
            color: #fff !important;
            border-color: rgba(255,255,255,0.2) !important;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
    // ---- Tile layers ----
    var layers = {
        dark: L.tileLayer('https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: 'CartoDB', maxZoom: 20, subdomains: 'abcd'
        }),
        satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri', maxZoom: 19
        }),
        streets: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'OpenStreetMap', maxZoom: 19
        })
    };

    // ---- Initialize map ----
    var map = L.map('map', {
        center: [20, 0],
        zoom: 3,
        zoomControl: true,
        attributionControl: false,
        layers: [layers.dark]
    });

    var currentLayer = 'dark';

    // ---- Marker clustering ----
    var clusterGroup = L.markerClusterGroup({
        maxClusterRadius: 40,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        iconCreateFunction: function(cluster) {
            var count = cluster.getChildCount();
            var size = count < 10 ? 'small' : (count < 50 ? 'medium' : 'large');
            return L.divIcon({
                html: '<div>' + count + '</div>',
                className: 'marker-cluster marker-cluster-' + size,
                iconSize: L.point(40, 40)
            });
        }
    });
    map.addLayer(clusterGroup);

    // ---- State ----
    var markers = {};
    var isReady = false;

    // Scope colors for dot markers
    var SCOPE_CLASSES = {
        'INTERNATIONAL': 'news-dot-international',
        'NATIONAL': 'news-dot-national',
        'REGIONAL': 'news-dot-regional',
        'LOCAL': 'news-dot-local'
    };

    // ---- Camera move listener ----
    var moveTimeout = null;
    map.on('moveend', function() {
        if (moveTimeout) clearTimeout(moveTimeout);
        moveTimeout = setTimeout(function() {
            if (typeof AndroidBridge !== 'undefined') {
                AndroidBridge.onCameraMove(getCurrentView());
            }
        }, 400);
    });

    // ---- Signal ready ----
    isReady = true;
    if (typeof AndroidBridge !== 'undefined') {
        AndroidBridge.onReady();
    }

    // ---- API functions called from Android ----
    function addMarkers(jsonArrayString) {
        try {
            var items = JSON.parse(jsonArrayString);
            var zoom = map.getZoom();

            items.forEach(function(item) {
                // Remove existing marker with same ID
                if (markers[item.id]) {
                    clusterGroup.removeLayer(markers[item.id]);
                }

                // Determine dot size based on recency
                var hoursAgo = (Date.now() - (item.publishedAt || Date.now())) / 3600000;
                var dotSize = hoursAgo < 6 ? 12 : (hoursAgo < 24 ? 9 : 7);
                if (zoom > 12) dotSize = 14;
                else if (zoom < 4) dotSize = 6;

                var scopeClass = SCOPE_CLASSES[item.scope] || SCOPE_CLASSES['NATIONAL'];

                var icon = L.divIcon({
                    className: 'news-dot ' + scopeClass,
                    iconSize: [dotSize, dotSize]
                });

                var marker = L.marker([item.lat, item.lon], { icon: icon });

                // Bind popup with title
                if (item.title) {
                    marker.bindTooltip(item.title.substring(0, 60), {
                        direction: 'top',
                        offset: [0, -8],
                        className: 'news-tooltip'
                    });
                }

                // Click handler
                marker.on('click', function() {
                    if (typeof AndroidBridge !== 'undefined') {
                        AndroidBridge.onMarkerTap(item.id);
                    }
                });

                marker.storyId = item.id;
                markers[item.id] = marker;
                clusterGroup.addLayer(marker);
            });
        } catch (e) {
            console.error('addMarkers error:', e);
        }
    }

    function clearMarkers() {
        clusterGroup.clearLayers();
        markers = {};
    }

    function flyTo(lat, lon, altitudeKm) {
        // Convert altitude (km) to approximate zoom level
        var zoom;
        if (altitudeKm > 10000) zoom = 3;
        else if (altitudeKm > 5000) zoom = 4;
        else if (altitudeKm > 2000) zoom = 5;
        else if (altitudeKm > 1000) zoom = 7;
        else if (altitudeKm > 500) zoom = 9;
        else if (altitudeKm > 100) zoom = 11;
        else if (altitudeKm > 50) zoom = 13;
        else zoom = 15;

        map.flyTo([lat, lon], zoom, { duration: 2.0 });
    }

    function getCurrentView() {
        var center = map.getCenter();
        var bounds = map.getBounds();
        var zoom = map.getZoom();

        // Approximate altitude from zoom level (rough conversion)
        var altitude = 40000 / Math.pow(2, zoom - 1);

        return JSON.stringify({
            lat: center.lat,
            lon: center.lng,
            altitude: altitude,
            bounds: {
                north: bounds.getNorth(),
                south: bounds.getSouth(),
                east: bounds.getEast(),
                west: bounds.getWest()
            }
        });
    }

    function setBaseLayer(providerName) {
        // Remove current layer
        if (layers[currentLayer]) {
            map.removeLayer(layers[currentLayer]);
        }

        // Add new layer
        var layerName = layers[providerName] ? providerName : 'dark';
        map.addLayer(layers[layerName]);
        currentLayer = layerName;
    }

    function highlightMarker(id) {
        if (!markers[id]) return;
        var marker = markers[id];
        // Flash the marker by toggling opacity
        var el = marker.getElement();
        if (el) {
            var n = 0;
            var iv = setInterval(function() {
                el.style.opacity = (n % 2 === 0) ? '0.3' : '1';
                if (++n >= 6) {
                    clearInterval(iv);
                    el.style.opacity = '1';
                }
            }, 300);
        }
    }
</script>
</body>
</html>

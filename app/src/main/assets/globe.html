<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlobeNews</title>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css">
    <style>
        * { margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #0d1117;
        }
        #cesiumContainer {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
        }
        #debugInfo {
            position: fixed; bottom: 60px; left: 5px; right: 5px;
            color: #0f0; font-family: monospace; font-size: 10px;
            z-index: 999999; pointer-events: none; background: rgba(0,0,0,0.85);
            padding: 6px; border-radius: 4px; white-space: pre-wrap;
            line-height: 1.3;
        }
        #statusMsg {
            position: fixed; top: 30%; left: 0; right: 0;
            text-align: center; color: #aaa; font-family: sans-serif; font-size: 14px;
            padding: 20px; z-index: 999998; pointer-events: none;
        }
        #statusMsg.error { color: #ff4444; }
        .cesium-viewer-bottom, .cesium-viewer-toolbar,
        .cesium-viewer-animationContainer, .cesium-viewer-timelineContainer,
        .cesium-viewer-fullscreenContainer, .cesium-viewer-infoBoxContainer,
        .cesium-viewer-selectionIndicatorContainer, .cesium-viewer-geocoderContainer,
        .cesium-viewer-navigationHelpButtonContainer {
            display: none !important;
        }
        .cesium-credit-logoContainer, .cesium-credit-expand-link,
        .cesium-credit-textContainer { display: none !important; }
    </style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="statusMsg">Loading Cesium.js...</div>
<div id="debugInfo">Starting...</div>

<script>
    var debugLines = [];
    function dbg(msg) {
        debugLines.push(msg);
        if (debugLines.length > 15) debugLines.shift();
        var el = document.getElementById('debugInfo');
        if (el) el.textContent = debugLines.join('\n');
        console.log('DBG: ' + msg);
    }

    window.onerror = function(msg, src, line) {
        dbg('ERR: ' + msg + ' L' + line);
        return false;
    };

    function showError(msg) {
        var el = document.getElementById('statusMsg');
        if (el) { el.className = 'error'; el.textContent = msg; el.style.display = 'block'; }
    }

    var SCOPE_COLORS = {};
    var viewer = null;
    var markers = {};
    var cameraMoveTimeout = null;
    var isReady = false;

    dbg('Page loaded, checking WebGL...');

    // Quick WebGL check
    (function() {
        var c = document.createElement('canvas');
        var gl = c.getContext('webgl2') || c.getContext('webgl');
        if (gl) {
            dbg('WebGL: ' + gl.getParameter(gl.RENDERER));
            dbg('Vendor: ' + gl.getParameter(gl.VENDOR));
        } else {
            dbg('NO WebGL!');
            showError('WebGL not available');
        }
    })();
</script>

<!-- Load Cesium synchronously - simpler and more reliable -->
<script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>

<script>
    dbg('Cesium loaded: ' + (typeof Cesium !== 'undefined'));

    if (typeof Cesium === 'undefined') {
        showError('Cesium.js failed to load');
        dbg('Cesium is undefined - CDN failed');
    } else {
        dbg('Cesium v' + Cesium.VERSION);
        initViewer();
    }

    function initViewer() {
        try {
            // Get token from Android bridge
            var token = '';
            try {
                if (typeof AndroidBridge !== 'undefined' && AndroidBridge.getCesiumToken) {
                    token = AndroidBridge.getCesiumToken();
                }
            } catch(e) {}

            if (token && token.length > 0) {
                Cesium.Ion.defaultAccessToken = token;
            }

            SCOPE_COLORS = {
                'INTERNATIONAL': Cesium.Color.fromCssColorString('#ff4444').withAlpha(0.9),
                'NATIONAL': Cesium.Color.fromCssColorString('#ff9944').withAlpha(0.9),
                'REGIONAL': Cesium.Color.fromCssColorString('#4488ff').withAlpha(0.9),
                'LOCAL': Cesium.Color.fromCssColorString('#4488ff').withAlpha(0.9)
            };

            dbg('Creating viewer...');

            viewer = new Cesium.Viewer('cesiumContainer', {
                baseLayer: false,
                baseLayerPicker: false,
                geocoder: false,
                homeButton: false,
                infoBox: false,
                sceneModePicker: false,
                selectionIndicator: false,
                timeline: false,
                animation: false,
                navigationHelpButton: false,
                fullscreenButton: false,
                vrButton: false,
                skyBox: false,
                skyAtmosphere: false,
                orderIndependentTranslucency: false,
                contextOptions: {
                    webgl: {
                        alpha: true,
                        depth: true,
                        stencil: false,
                        antialias: true,
                        preserveDrawingBuffer: true,
                        failIfMajorPerformanceCaveat: false
                    }
                }
            });

            dbg('Viewer OK');

            // Disable logarithmic depth buffer - causes issues on some mobile GPUs
            viewer.scene.logarithmicDepthBuffer = false;
            dbg('LogDepth disabled');

            // Flat terrain
            viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider();

            // Globe appearance - BRIGHT GREEN for debug visibility
            viewer.scene.globe.enableLighting = false;
            viewer.scene.globe.showGroundAtmosphere = false;
            viewer.scene.globe.depthTestAgainstTerrain = false;
            viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#00ff00');
            viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#1a0000');
            dbg('Globe baseColor=#00ff00 (GREEN)');

            // Add OSM tiles
            try {
                viewer.imageryLayers.addImageryProvider(
                    new Cesium.UrlTemplateImageryProvider({
                        url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                        credit: 'OSM',
                        maximumLevel: 19
                    })
                );
                dbg('OSM imagery added');
            } catch(e) {
                dbg('Imagery err: ' + e.message);
            }

            // Canvas info
            var canvas = viewer.scene.canvas;
            dbg('Canvas: ' + canvas.width + 'x' + canvas.height + ' css:' + canvas.clientWidth + 'x' + canvas.clientHeight);

            // Check GL on viewer's canvas
            var gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
            if (gl) {
                dbg('Viewer GL: ' + gl.drawingBufferWidth + 'x' + gl.drawingBufferHeight);
                // Read center pixel color after a delay
                setTimeout(function() {
                    try {
                        viewer.scene.render();
                        var px = new Uint8Array(4);
                        var cx = Math.floor(gl.drawingBufferWidth / 2);
                        var cy = Math.floor(gl.drawingBufferHeight / 2);
                        gl.readPixels(cx, cy, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
                        dbg('Center pixel: rgba(' + px[0] + ',' + px[1] + ',' + px[2] + ',' + px[3] + ')');
                    } catch(e) {
                        dbg('readPixels err: ' + e.message);
                    }
                }, 3000);
            } else {
                dbg('Viewer GL: FAILED to get context');
            }

            // Entity clustering
            viewer.dataSourceDisplay.defaultDataSource.clustering.enabled = true;
            viewer.dataSourceDisplay.defaultDataSource.clustering.pixelRange = 40;
            viewer.dataSourceDisplay.defaultDataSource.clustering.minimumClusterSize = 3;

            // Camera move listener
            viewer.camera.moveEnd.addEventListener(function() {
                if (cameraMoveTimeout) clearTimeout(cameraMoveTimeout);
                cameraMoveTimeout = setTimeout(function() {
                    if (typeof AndroidBridge !== 'undefined') {
                        AndroidBridge.onCameraMove(getCurrentView());
                    }
                }, 400);
            });

            // Marker click handler
            var handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
            handler.setInputAction(function(click) {
                var picked = viewer.scene.pick(click.position);
                if (Cesium.defined(picked) && picked.id && picked.id.storyId) {
                    if (typeof AndroidBridge !== 'undefined') {
                        AndroidBridge.onMarkerTap(picked.id.storyId);
                    }
                }
            }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

            // Hide status, show we're ready
            document.getElementById('statusMsg').style.display = 'none';
            isReady = true;
            dbg('Globe READY');

            if (typeof AndroidBridge !== 'undefined') {
                AndroidBridge.onReady();
            }

        } catch (e) {
            dbg('INIT FAIL: ' + e.message);
            dbg('Stack: ' + (e.stack || '').substring(0, 300));
            showError('Init failed: ' + e.message);
        }
    }

    // ---- API functions called from Android ----
    function addMarkers(jsonArrayString) {
        if (!viewer) return;
        try {
            var items = JSON.parse(jsonArrayString);
            var altitude = viewer.camera.positionCartographic.height / 1000;
            items.forEach(function(item) {
                if (markers[item.id]) viewer.entities.remove(markers[item.id]);
                var color = SCOPE_COLORS[item.scope] || SCOPE_COLORS['NATIONAL'];
                var hoursAgo = (Date.now() - (item.publishedAt || Date.now())) / 3600000;
                var size = hoursAgo < 6 ? 12 : (hoursAgo < 24 ? 9 : 7);
                if (altitude > 15000) size = 6;
                else if (altitude < 500) size = 14;
                var entity = viewer.entities.add({
                    position: Cesium.Cartesian3.fromDegrees(item.lon, item.lat),
                    point: {
                        pixelSize: size, color: color,
                        outlineColor: Cesium.Color.WHITE.withAlpha(0.5), outlineWidth: 1,
                        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                        disableDepthTestDistance: Number.POSITIVE_INFINITY
                    },
                    label: altitude < 500 ? {
                        text: item.title ? item.title.substring(0, 40) : '',
                        font: '11px sans-serif', fillColor: Cesium.Color.WHITE,
                        outlineColor: Cesium.Color.BLACK, outlineWidth: 2,
                        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                        pixelOffset: new Cesium.Cartesian2(0, -16),
                        disableDepthTestDistance: Number.POSITIVE_INFINITY,
                        showBackground: true,
                        backgroundColor: Cesium.Color.fromCssColorString('rgba(0,0,0,0.7)')
                    } : undefined
                });
                entity.storyId = item.id;
                markers[item.id] = entity;
            });
        } catch (e) { console.error('addMarkers:', e); }
    }

    function clearMarkers() {
        if (!viewer) return;
        Object.keys(markers).forEach(function(id) { viewer.entities.remove(markers[id]); });
        markers = {};
    }

    function flyTo(lat, lon, altitudeKm) {
        if (!viewer) return;
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(lon, lat, altitudeKm * 1000),
            duration: 2.0
        });
    }

    function getCurrentView() {
        if (!viewer) return '{}';
        var c = viewer.camera.positionCartographic;
        var lat = Cesium.Math.toDegrees(c.latitude);
        var lon = Cesium.Math.toDegrees(c.longitude);
        var altitude = c.height / 1000;
        var rect = viewer.camera.computeViewRectangle();
        var bounds;
        if (rect) {
            bounds = {
                north: Cesium.Math.toDegrees(rect.north), south: Cesium.Math.toDegrees(rect.south),
                east: Cesium.Math.toDegrees(rect.east), west: Cesium.Math.toDegrees(rect.west)
            };
        } else {
            bounds = {
                north: Math.min(lat + 30, 90), south: Math.max(lat - 30, -90),
                east: Math.min(lon + 60, 180), west: Math.max(lon - 60, -180)
            };
        }
        return JSON.stringify({ lat: lat, lon: lon, altitude: altitude, bounds: bounds });
    }

    function setBaseLayer(providerName) {
        if (!viewer) return;
        viewer.imageryLayers.removeAll();
        var provider;
        switch (providerName) {
            case 'satellite':
                provider = new Cesium.UrlTemplateImageryProvider({
                    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                    maximumLevel: 18
                });
                break;
            case 'streets':
                provider = new Cesium.UrlTemplateImageryProvider({
                    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                    credit: 'OpenStreetMap', maximumLevel: 19
                });
                break;
            case 'dark':
                provider = new Cesium.UrlTemplateImageryProvider({
                    url: 'https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                    credit: 'CartoDB', maximumLevel: 18
                });
                break;
            default:
                provider = new Cesium.UrlTemplateImageryProvider({
                    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                    credit: 'OpenStreetMap', maximumLevel: 19
                });
                break;
        }
        viewer.imageryLayers.addImageryProvider(provider);
    }

    function highlightMarker(id) {
        if (!viewer || !markers[id]) return;
        var entity = markers[id];
        if (entity.point) {
            var orig = entity.point.pixelSize.getValue();
            var n = 0;
            var iv = setInterval(function() {
                entity.point.pixelSize = (n % 2 === 0) ? orig * 1.8 : orig;
                entity.point.outlineWidth = (n % 2 === 0) ? 3 : 1;
                if (++n >= 6) { clearInterval(iv); entity.point.pixelSize = orig; entity.point.outlineWidth = 1; }
            }, 300);
        }
    }
</script>
</body>
</html>
